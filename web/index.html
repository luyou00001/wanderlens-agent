<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wanderlens 監控</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2312100e'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23e0a15a' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <div class="app">
      <aside class="rail">
        <div>
          <p class="brand">Wanderlens</p>
          <p class="brand-sub">本機監控</p>
        </div>
        <nav class="nav" aria-label="監控分頁">
          <button class="nav-button is-current" type="button" data-view="overview" aria-current="page">總覽</button>
          <button class="nav-button" type="button" data-view="library">素材</button>
          <button class="nav-button" type="button" data-view="models">模型</button>
          <button class="nav-button" type="button" data-view="activity">活動</button>
        </nav>
        <p class="rail-note">不提供原始檔，也不顯示座標。</p>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <div>
            <h1 class="view-title" id="view-title">總覽</h1>
            <p class="status-line" id="status-line">正在讀取索引。</p>
            <p class="library-path" id="library-path"></p>
          </div>
          <div class="topbar-actions">
            <span class="live-dot" id="live-dot" aria-hidden="true"></span>
            <button class="button" type="button" id="live-toggle">暫停更新</button>
            <button class="button button-primary" type="button" id="refresh">立即更新</button>
          </div>
        </header>
        <main class="stage" data-stage></main>
      </div>
    </div>
    <noscript><p class="noscript">監控頁需要啟用 JavaScript。請用瀏覽器開啟 wanderlens ui 印出的網址。</p></noscript>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
