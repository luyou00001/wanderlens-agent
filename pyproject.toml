[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wanderlens-agent"
version = "0.2.3"
description = "在本機把旅行照片與影片整理成待審閱的社群草稿與數位影像包。"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wanderlens" }]
keywords = ["photography", "vision-language", "local-llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "Pillow>=10.4.0",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[project.scripts]
wanderlens = "wanderlens.cli:main"

[project.urls]
Homepage = "https://github.com/luyou00001/wanderlens-agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
